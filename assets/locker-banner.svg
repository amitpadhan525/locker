<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Shield Glow & Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Decorative Grid Lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Decorative Ambient Glow Circles -->
  <circle cx="200" cy="200" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="100" r="150" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Left Side: Shield Vault Logo -->
  <g transform="translate(140, 70)" filter="url(#shadow)">
    <!-- Outer Shield Shape -->
    <path d="M 130 10 L 230 50 C 230 170 180 230 130 260 C 80 230 30 170 30 50 Z" 
          fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="3" />

    <!-- Inner Shield Inset -->
    <path d="M 130 25 L 215 60 C 215 160 172 215 130 240 C 88 215 45 160 45 60 Z" 
          fill="#0f172a" opacity="0.45" />

    <!-- Lock Shackle -->
    <path d="M 105 130 V 105 C 105 90 115 80 130 80 C 145 80 155 90 155 105 V 130" 
          fill="none" stroke="url(#lockGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Lock Body -->
    <rect x="95" y="125" width="70" height="60" rx="10" fill="url(#lockGrad)" />

    <!-- Keyhole -->
    <circle cx="130" cy="150" r="6" fill="#1e293b"/>
    <polygon points="127,152 133,152 135,168 125,168" fill="#1e293b"/>
  </g>

  <!-- Right Side: Text & Taglines -->
  <!-- Project Title -->
  <text x="440" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="88" font-weight="900" letter-spacing="2" fill="#ffffff">
    LOCKER
  </text>

  <!-- Accent Line -->
  <rect x="445" y="195" width="620" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Subtitle -->
  <text x="445" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" font-weight="600" fill="#94a3b8">
    Zero-Knowledge Encrypted Vault &amp; Storage Drive
  </text>

  <!-- Pill Feature Tags -->
  <!-- Tag 1: AES-256-GCM -->
  <g transform="translate(445, 275)">
    <rect width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="5" fill="#38bdf8"/>
    <text x="34" y="23" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">AES-256-GCM</text>
  </g>

  <!-- Tag 2: Argon2id KDF -->
  <g transform="translate(610, 275)">
    <rect width="140" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="5" fill="#a855f7"/>
    <text x="34" y="23" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Argon2id KDF</text>
  </g>

  <!-- Tag 3: 100% Offline -->
  <g transform="translate(765, 275)">
    <rect width="135" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="5" fill="#22c55e"/>
    <text x="34" y="23" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">100% Offline</text>
  </g>

  <!-- Tag 4: Desktop & CLI -->
  <g transform="translate(915, 275)">
    <rect width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="5" fill="#f59e0b"/>
    <text x="34" y="23" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">GUI + CLI + Mount</text>
  </g>
</svg>
