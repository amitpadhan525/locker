<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Terminal Container Window -->
  <g filter="url(#shadow)" transform="translate(20, 20)">
    <!-- Window Header -->
    <rect width="860" height="440" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M 0 10 C 0 4 4 0 10 0 L 850 0 C 856 0 860 4 860 10 L 860 38 L 0 38 Z" fill="#1e293b"/>
    <line x1="0" y1="38" x2="860" y2="38" stroke="#334155" stroke-width="1"/>

    <!-- Window Buttons -->
    <circle cx="20" cy="19" r="6" fill="#ef4444"/>
    <circle cx="40" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="19" r="6" fill="#22c55e"/>

    <!-- Window Title -->
    <text x="430" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">
      user@local-machine: ~/github/locker — (cli.py)
    </text>

    <!-- Terminal Prompt & Commands -->
    <!-- Line 1: Init -->
    <text x="20" y="70" font-family="monospace" font-size="14" fill="#38bdf8">user@local:~$ </text>
    <text x="135" y="70" font-family="monospace" font-size="14" fill="#f8fafc">python3 cli.py init</text>
    <text x="20" y="92" font-family="monospace" font-size="13" fill="#94a3b8">Set New Master Password: ***************</text>
    <text x="20" y="112" font-family="monospace" font-size="13" fill="#22c55e">Success: Initialized new encrypted vault at 'vault.vault'!</text>

    <!-- Line 2: Add File -->
    <text x="20" y="145" font-family="monospace" font-size="14" fill="#38bdf8">user@local:~$ </text>
    <text x="135" y="145" font-family="monospace" font-size="14" fill="#f8fafc">python3 cli.py add-file tax_2026.pdf --category "Finance" --notes "Confidential"</text>
    <text x="20" y="167" font-family="monospace" font-size="13" fill="#94a3b8">Enter Master Password: ***************</text>
    <text x="20" y="187" font-family="monospace" font-size="13" fill="#22c55e">Success: Encrypted and stored 'tax_2026.pdf' (ID: e4a1b2c3-9876-4a12)</text>

    <!-- Line 3: Add Note -->
    <text x="20" y="220" font-family="monospace" font-size="14" fill="#38bdf8">user@local:~$ </text>
    <text x="135" y="220" font-family="monospace" font-size="14" fill="#f8fafc">python3 cli.py add-note --title "Server SSH Key" --category "Keys"</text>
    <text x="20" y="242" font-family="monospace" font-size="13" fill="#94a3b8">Enter Master Password: ***************</text>
    <text x="20" y="262" font-family="monospace" font-size="13" fill="#22c55e">Success: Stored encrypted note 'Server SSH Key' (ID: b876c5d4-1234-5678)</text>

    <!-- Line 4: List Vault Items -->
    <text x="20" y="295" font-family="monospace" font-size="14" fill="#38bdf8">user@local:~$ </text>
    <text x="135" y="295" font-family="monospace" font-size="14" fill="#f8fafc">python3 cli.py list</text>
    <text x="20" y="317" font-family="monospace" font-size="13" fill="#94a3b8">Enter Master Password: ***************</text>
    <text x="20" y="340" font-family="monospace" font-size="12" fill="#c084fc">--- Vault Items (2) ---</text>
    <text x="20" y="358" font-family="monospace" font-size="12" fill="#e2e8f0">ID                                   Type     Category     Size       Name</text>
    <text x="20" y="374" font-family="monospace" font-size="12" fill="#64748b">--------------------------------------------------------------------------------</text>
    <text x="20" y="392" font-family="monospace" font-size="12" fill="#e2e8f0">e4a1b2c3-9876-4a12-8811-998877665544 file     Finance      45281 B    tax_2026.pdf</text>
    <text x="20" y="410" font-family="monospace" font-size="12" fill="#e2e8f0">b876c5d4-1234-5678-aaaa-bbbbccccdddd note     Keys         128 B      Server SSH Key</text>
  </g>
</svg>
